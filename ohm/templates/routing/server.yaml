{{- $r := .Values.ohmRouting | default dict -}}
{{- if $r.enabled }}
{{- $name := include "routing.name" . -}}
{{- $server := $r.server | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-server
  labels:
    {{- include "routing.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ $server.replicas | default 1 }}
  # The new pod loads the new graph before the old one stops, so restarts have no downtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: routing
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "routing.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- include "routing.scheduling" . | nindent 6 }}
      containers:
        - name: server
          image: {{ include "routing.image" . }}
          command: ["/app/scripts/start.sh"]
          env:
            - { name: JAVA_OPTS, value: {{ $server.javaOpts | default "-Xms1g -Xmx3g" | quote }} }
          ports:
            - { name: http, containerPort: 8989 }
          # The first start downloads the planet and builds a graph
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: {{ $server.startupFailureThreshold | default 60 }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 4
          {{- with $server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: graph, mountPath: /tmp/graph }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
        - name: graph
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-server
  labels:
    {{- include "routing.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: routing
    app.kubernetes.io/component: server
  ports:
    - { name: http, port: 8989, targetPort: http }
{{- end }}
