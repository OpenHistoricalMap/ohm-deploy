{{- $r := .Values.ohmRouting | default dict -}}
{{- if $r.enabled }}
{{- $p := $r.persistence | default dict }}
# Planet and graphs. local-path pins it to one node, and every pod that mounts it
# is scheduled there.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "routing.name" . }}-data
  labels:
    {{- include "routing.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $p.storageClass | default "local-path" }}
  resources:
    requests:
      storage: {{ $p.size | default "20Gi" }}
{{- end }}
