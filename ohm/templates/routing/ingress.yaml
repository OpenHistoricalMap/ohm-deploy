{{- $r := .Values.ohmRouting | default dict -}}
{{- $ing := $r.ingress | default dict -}}
{{- if and $r.enabled $ing.enabled }}
{{- $name := include "routing.name" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "routing.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ $ing.className | default "traefik" }}
  rules:
    - host: {{ $ing.host }}
      http:
        paths:
          {{- range list "/route" "/info" "/health" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-server
                port: { name: http }
          {{- end }}
          {{- if ($r.web | default dict).enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-web
                port: { name: http }
          {{- end }}
{{- end }}
