{{- if and .Values.ohmRouting.enabled .Values.ohmRouting.update.enabled }}
# The update job restarts the server after it builds a new graph
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-routing-update
  labels:
    {{- include "routing.labels" (dict "root" . "component" "routing-update") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-routing-update
  labels:
    {{- include "routing.labels" (dict "root" . "component" "routing-update") | nindent 4 }}
rules:
  # rollout restart of the server deployment only
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["{{ .Release.Name }}-routing-server"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-routing-update
  labels:
    {{- include "routing.labels" (dict "root" . "component" "routing-update") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-routing-update
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-routing-update
    namespace: {{ .Release.Namespace }}
{{- end }}
