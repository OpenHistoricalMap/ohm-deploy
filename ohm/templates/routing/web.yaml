{{- $r := .Values.ohmRouting | default dict -}}
{{- if and $r.enabled ($r.web | default dict).enabled }}
{{- $name := include "routing.name" . -}}
# Test page (images/routing/web): pick A and B on the map and a date
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-web
  labels:
    {{- include "routing.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: routing
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "routing.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: {{ include "routing.image" . }}
          command: ["python3", "-m", "http.server", "8080", "--directory", "/app/web"]
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-web
  labels:
    {{- include "routing.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: routing
    app.kubernetes.io/component: web
  ports:
    - { name: http, port: 80, targetPort: http }
{{- end }}
