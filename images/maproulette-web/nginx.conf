server {
  listen 80;
  charset utf-8;
  client_max_body_size 100M;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  root /var/www/maproulette;

  # Old MR3 links
  rewrite ^/mr3/?(.*)$ /$1 permanent;

  location /ws {
    proxy_pass ${MR_API_URL};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 1h;
  }

  # Backend routes
  location ~ ^(/api/|/auth/|/docs/|/assets/lib/|/assets/swagger.json|/ping) {
    proxy_pass ${MR_API_URL};
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # App shell and runtime config must not be cached
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location = /env.json {
    add_header Cache-Control "no-store";
  }

  # Hashed assets. No fallback to index.html, it confuses the router on missing chunks.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
