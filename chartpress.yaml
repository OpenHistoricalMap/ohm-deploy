charts:
  - name: ohm
    imagePrefix: ghcr.io/openhistoricalmap/
    images:
      web:
        valuesPath: osm-seed.web.image
      db:
        valuesPath: osm-seed.db.image
      tiler-db:
        valuesPath: osm-seed.tilerDb.image
      tiler-imposm:
        valuesPath: osm-seed.tilerImposm.image
      tiler-server-martin:
        valuesPath: osm-seed.tilerServerMartin.image
      tasking-manager-api:
        valuesPath: osm-seed.tmApi.image
      cgimap:
        valuesPath: osm-seed.cgimap.image
      tiler-cache:
        valuesPath: osm-seed.tilerCache.image
      tiler-monitor-pipeline:
        valuesPath: osm-seed.tilerMonitorPipeline.image
      tiler-monitor-language:
        valuesPath: osm-seed.tilerMonitorLanguage.image
      ohmx-adiff-builder:
        valuesPath: osm-seed.osmxAdiffBuilder.image
      planet-stats:
        valuesPath: osm-seed.planetStats.image
      overpass-api:
        valuesPath: osm-seed.overpassApi.image
        