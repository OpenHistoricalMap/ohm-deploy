# Tiler-only preview overlay for a vtiles-* branch on k3s staging.
#
# Deployed as helm release `tiler-<slug>` in the `preview` namespace by
# preview-tiler-up.yaml. It builds an independent tiler stack (db + imposm +
# martin) on its own host disks, so it never touches the live tiler:
#   /mnt/tiler-db-data-<slug>      (postgres data)
#   /mnt/tiler-imposm-data-<slug>  (imposm cache + replication state)
#
# imposm runs a full import from the PBF with the branch's mappings, then
# builds the mviews. Martin is exposed at tiler-<slug>.ohmstaging.org through a
# standalone Ingress created by the workflow (the chart does not template an
# ingress for martin).
#
# Placeholders: {{SLUG}} {{AWS_ACCESS_KEY_ID}} {{AWS_SECRET_ACCESS_KEY}}
osm-seed:
  environment: staging
  cloudProvider: k3s
  serviceType: ClusterIP
  createClusterIssuer: false
  ingressClassName: ""
  domain: ohmstaging.org
  adminEmail: admin@openhistoricalmap.org

  # --- everything off except the tiler build chain ---
  web: { enabled: false }
  db: { enabled: false }
  memcached: { enabled: false }
  cgimap: { enabled: false }
  fullHistory: { enabled: false }
  changesetsDump: { enabled: false }
  dbBackupRestore: { enabled: false }
  planetDump: { enabled: false }
  replicationJob: { enabled: false }
  populateApidb: { enabled: false }
  osmProcessor: { enabled: false }
  tilerServer: { enabled: false }
  tilerVarnish: { enabled: false }
  tilerServerCacheCleaner: { enabled: false }
  tilerCacheCleanerJob: { enabled: false }
  tilerCache: { enabled: false }
  tilerMonitorPipeline: { enabled: false }
  tmDb: { enabled: false }
  tmApi: { enabled: false }
  osmSimpleMetrics: { enabled: false }
  monitoringReplication: { enabled: false }
  changesetReplicationJob: { enabled: false }
  planetFiles: { enabled: false }
  taginfoWeb: { enabled: false }
  taginfoDataProcessor: { enabled: false }
  nominatimUI: { enabled: false }
  nominatimApi: { enabled: false }
  overpassApi: { enabled: false }
  osmchaWeb: { enabled: false }
  osmchaApi: { enabled: false }
  osmchaDb: { enabled: false }
  osmxAdiffBuilder: { enabled: false }
  planetStats: { enabled: false }

  # --- tiler build chain ON, on per-branch disks ---
  tilerDb:
    enabled: true
    priorityClass: medium-priority
    env:
      POSTGRES_DB: tiler_osm_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456789"
      POSTGRES_PORT: 5432
    sharedMemorySize: 2Gi
    persistenceDisk:
      enabled: true
      accessMode: ReadWriteOnce
      mountPath: /var/lib/postgresql/data
      subPath: postgresql-data
      staticHostPath: true
      localVolumeHostPath: /mnt/tiler-db-data-{{SLUG}}
    resources:
      enabled: false

  tilerImposm:
    enabled: true
    priorityClass: medium-priority
    serviceAccount:
      enabled: false
    env:
      TILER_IMPORT_FROM: osm
      TILER_IMPORT_PBF_URL: https://s3.amazonaws.com/planet.openhistoricalmap.org/planet/planet-260531_0302.osm.pbf
      REPLICATION_URL: http://s3.amazonaws.com/planet.openhistoricalmap.org/replication/minute/
      SEQUENCE_NUMBER: "1690000"
      OVERWRITE_STATE: false
      # preview must not write to the shared S3 expiry/language buckets
      UPLOAD_EXPIRED_FILES: false
      IMPORT_NATURAL_EARTH: true
      IMPORT_OSM_LAND: true
      IMPOSM3_IMPORT_LAYERS: "all"
      CLOUDPROVIDER: aws
      AWS_S3_BUCKET: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      REFRESH_MVIEWS: true
      RECREATE_MVIEWS_ON_UPDATE: false
    persistenceDisk:
      enabled: true
      accessMode: ReadWriteOnce
      mountPath: /mnt/data
      staticHostPath: true
      localVolumeHostPath: /mnt/tiler-imposm-data-{{SLUG}}
    resources:
      enabled: true
    nodeSelector:
      enabled: false
    nodeAffinity:
      enabled: false

  tilerServerMartin:
    enabled: true
    priorityClass: medium-priority
    replicaCount: 1
    env:
      OHM_DOMAIN: ohmstaging.org
      MARTIN_WORKER_PROCESSES: 8
      MARTIN_POOL_SIZE: 10
      # empty bucket = skip the vtiles_languages.geojson upload to S3
      AWS_S3_BUCKET: ""
    resources:
      enabled: false
    nodeSelector:
      enabled: false
    nodeAffinity:
      enabled: false
