  # ====================================================================================================
  # Variables for nominatim api
  # ====================================================================================================
  nominatimUI:
    enabled: false
    image:
      name: ghcr.io/openhistoricalmap/nominatim-ui
      tag: a469b5e
  # ====================================================================================================
  # Variables for nominatim api
  # ====================================================================================================
  nominatimApi:
    enabled: false
    ingress:
      enabled: false
    priorityClass: medium-priority
    serviceAnnotations:
      service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "300"
    replicaCount: 1
    startupProbe:
      enabled: true
      failureThreshold: 1440
    livenessProbe:
      enabled: true
    env:
      NOMINATIM_API_ENDPOINT: nominatim.ohmstaging.org
      PBF_URL: https://planet.openhistoricalmap.org/planet/planet-260808_0031.osm.pbf
      REPLICATION_URL: https://planet.openhistoricalmap.org/replication/minute
      REPLICATION_UPDATE_INTERVAL: 60
      REPLICATION_RECHECK_INTERVAL: 30
      THREADS: 8
      FREEZE: false
      IMPORT_WIKIPEDIA: false
      IMPORT_US_POSTCODES: false
      IMPORT_GB_POSTCODES: false
      IMPORT_TIGER_ADDRESSES: false
      PGDATA: /var/lib/postgresql/16/main
      OSMSEED_WEB_API_DOMAIN: www.${OHM_DOMAIN}
      UPDATE_MODE: continuous
      IMPORT_STYLE: /app/ohm-import.lua
      EXTRA_TAGS: "start_date,start_date:edtf,end_date,end_date:edtf"
      NOMINATIM_PASSWORD: "{{STAGING_NOMINATIM_PG_PASSWORD}}"
    resources: {}
    persistenceDisk:
      enabled: true
      accessMode: ReadWriteOnce
      mountPath: /var/lib/postgresql/16/main
      subPath: nominatim-pgdata
      staticHostPath: true
      localVolumeHostPath: /mnt/nominatim-db-data-v003
    nodeSelector: {}
    nodeAffinity:
      enabled: true
      key: "nodegroup_type"
      values: ["downstream"]
  # ====================================================================================================
  # Variables for overpass-api
