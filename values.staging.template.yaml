      OAUTH2_CLIENT_ID: "Zt8qjPDUx9H_upbhNrR0Q91hkw2Pl1VzM3pxjRxGnUU"
      OAUTH2_CLIENT_SECRET: "hokGQq7NznsxA2tQ5Hij7a1vn8rKItf6ApVaxd08dCc"
      OVERPASS_API: "overpass-api.openhistoricalmap.org"
