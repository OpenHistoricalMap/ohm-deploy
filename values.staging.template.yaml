      # --- Upload to S3
      CLOUDPROVIDER: aws
      AWS_S3_BUCKET: s3://planet-staging.openhistoricalmap.org
      AWS_S3_ENDPOINT: ""
      AWS_ACCESS_KEY_ID: {{STAGING_AWS_KEY}}
      AWS_SECRET_ACCESS_KEY: {{STAGING_AWS_KEY_SECRET}}
    # resources enabled with high memory/cpu for the processing job;
    resources: {}
    nodeSelector: {}
    nodeAffinity:
      enabled: true
      key: "nodegroup_type"
      values: ["downstream"]
