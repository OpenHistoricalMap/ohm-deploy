# ============================================================
# OHM Services - Default values
# ============================================================
# This file holds defaults. Override per environment via:
#   values.staging.template.yaml
#   values.production.template.yaml
# Image tags for OHM-owned services are rewritten by chartpress
# during CI builds. Third-party images keep pinned tags here.
# ============================================================

global:
  environment: production
  domain: openhistoricalmap.org
  storageClass: local-path
  imagePullPolicy: IfNotPresent
  # Traefik IngressRoute (k3s ships Traefik by default)
  ingressClass: traefik

# ============================================================
# Taginfo
# ============================================================
taginfo:
  enabled: true
  web:
    enabled: true
    image:
      repository: ghcr.io/osm-seed/taginfo-web
      tag: "0.1.0-0.dev.git.986.h0fae372"
    replicas: 1
    port: 4567
    resources:
      enabled: false
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { cpu: 2,    memory: 4Gi }
    env:
      URL_PLANET_FILE_STATE: https://s3.amazonaws.com/planet.openhistoricalmap.org/planet/state.txt
      URL_HISTORY_PLANET_FILE_STATE: https://s3.amazonaws.com/planet.openhistoricalmap.org/planet/full-history/state.txt
      URL_PLANET_FILE: none
      URL_HISTORY_PLANET_FILE: none
      TIME_UPDATE_INTERVAL: 7d
      OVERWRITE_CONFIG_URL: https://raw.githubusercontent.com/OpenHistoricalMap/ohm-deploy/main/images/taginfo/taginfo-config-production.json
      TAGINFO_PROJECT_REPO: https://github.com/OpenHistoricalMap/taginfo-projects.git
      DOWNLOAD_DB: languages wiki
      CREATE_DB: db projects chronology
      ENVIRONMENT: production
      INTERVAL_DOWNLOAD_DATA: 7d
      FETCH_DB_FILES: "false"
      TAGINFO_DB_BASE_URL: https://planet.openhistoricalmap.org.s3.amazonaws.com/taginfo
  data:
    enabled: true
    image:
      repository: ghcr.io/osm-seed/taginfo
      tag: "0.1.0-0.dev.git.984.hb289ff1"
    # CronJob config
    schedule: "0 0 */7 * *"      # every 7 days at 00:00 UTC
    timeZone: "UTC"              # IANA tz (optional, k8s 1.27+)
    concurrencyPolicy: Forbid    # Allow | Forbid | Replace
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 3
    activeDeadlineSeconds: 86400  # kill job after 24h if still running
    resources:
      enabled: false
      requests: { cpu: 1, memory: 2Gi }
      limits:   { cpu: 4, memory: 8Gi }
    env:
      AWS_S3_BUCKET: planet.openhistoricalmap.org
      DOCKER_CONFIG_ENVIRONMENT: production
      URL_PLANET_FILE_STATE: https://s3.amazonaws.com/planet.openhistoricalmap.org/planet/state.txt
      URL_HISTORY_PLANET_FILE_STATE: https://s3.amazonaws.com/planet.openhistoricalmap.org/planet/full-history/state.txt
      URL_PLANET_FILE: none
      URL_HISTORY_PLANET_FILE: none
      TIME_UPDATE_INTERVAL: 7d
      OVERWRITE_CONFIG_URL: https://raw.githubusercontent.com/OpenHistoricalMap/ohm-deploy/main/images/taginfo/taginfo-config-production.json
      TAGINFO_PROJECT_REPO: https://github.com/OpenHistoricalMap/taginfo-projects.git
      DOWNLOAD_DB: languages wiki
      CREATE_DB: db projects chronology
      ENVIRONMENT: production
      INTERVAL_DOWNLOAD_DATA: 7d
      FETCH_DB_FILES: "false"
      TAGINFO_DB_BASE_URL: https://planet.openhistoricalmap.org.s3.amazonaws.com/taginfo

# ============================================================
# Overpass
# ============================================================
overpass:
  enabled: true
  image:
    # repository + tag rewritten by chartpress
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    enabled: false
    requests: { cpu: 2, memory: 8Gi }
    limits:   { cpu: 8, memory: 32Gi }
  env:
    OVERPASS_META: "attic"
    OVERPASS_MODE: "init"
    OVERPASS_PLANET_URL: "https://s3.amazonaws.com/planet.openhistoricalmap.org/planet/full-history/planet-history-260510_0442.osm.pbf"
    OVERPASS_DIFF_URL: "http://s3.amazonaws.com/planet.openhistoricalmap.org/replication/minute"
    OVERPASS_RULES_LOAD: "10"
    OVERPASS_REPLICATION_SEQUENCE_NUMBER: "1900000"
    OVERPASS_ALLOW_DUPLICATE_QUERIES: "no"
    OVERPASS_RATE_LIMIT: "2"
  persistence:
    size: 500Gi
    mountPath: /db

# ============================================================
# Nominatim
# ============================================================
nominatim:
  enabled: true
  api:
    enabled: true
    image:
      repository: developmentseed/osmseed-nominatim
      tag: "0.1.0-0.dev.git.956.h49d677b"
    replicas: 1
    # Public URL of the Nominatim API. The UI injects this into its JS config.
    publicUrl: https://nominatim.openhistoricalmap.org
    resources:
      enabled: false
      requests: { cpu: 2, memory: 8Gi }
      limits:   { cpu: 8, memory: 32Gi }
    env:
      PBF_URL: "http://s3.amazonaws.com/planet.openhistoricalmap.org/planet/planet-260408_0307.osm.pbf"
      REPLICATION_URL: "http://planet.openhistoricalmap.org.s3.amazonaws.com/replication/minute"
      REPLICATION_UPDATE_INTERVAL: "60"
      REPLICATION_RECHECK_INTERVAL: "30"
      THREADS: "8"
      FREEZE: "false"
      IMPORT_WIKIPEDIA: "false"
      IMPORT_US_POSTCODES: "false"
      IMPORT_GB_POSTCODES: "false"
      IMPORT_TIGER_ADDRESSES: "false"
      PGDATA: "/var/lib/postgresql/16/main"
      UPDATE_MODE: "continuous"
      IMPORT_STYLE: "extratags"
      EXTRA_TAGS: "start_date,start_date:edtf,end_date,end_date:edtf"
      NOMINATIM_ADDRESS_LEVEL_CONFIG_URL: "https://raw.githubusercontent.com/OpenHistoricalMap/nominatim-ui/master/address-levels.json"
  ui:
    enabled: true
    image:
      repository: ghcr.io/openhistoricalmap/nominatim-ui
      tag: "a469b5e"
    replicas: 1
    resources:
      enabled: false
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }
  persistence:
    size: 300Gi
    mountPath: /var/lib/postgresql/16/main

# ============================================================
# OSMCha
# ============================================================
osmcha:
  enabled: true
  django:
    image:
      # repository + tag rewritten by chartpress (osmcha-django built in OHM org)
      pullPolicy: IfNotPresent
    api:
      replicas: 2
      resources:
        enabled: false
        requests: { cpu: 500m, memory: 1Gi }
        limits:   { cpu: 2,    memory: 4Gi }
    cron:
      enabled: true
      resources:
        enabled: false
        requests: { cpu: 200m, memory: 512Mi }
        limits:   { cpu: 1,    memory: 2Gi }
  frontend:
    image:
      repository: ghcr.io/openhistoricalmap/osmcha-frontend
      tag: "df5e9b5"
    replicas: 1
    resources:
      enabled: false
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }
  db:
    image:
      repository: postgis/postgis
      tag: "17-3.5"
    resources:
      enabled: false
      requests: { cpu: 1, memory: 2Gi }
      limits:   { cpu: 4, memory: 8Gi }
    persistence:
      size: 100Gi
  redis:
    image:
      repository: redis
      tag: "7.4-alpine"
    resources:
      enabled: false
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 500m, memory: 1Gi }

# ============================================================
# Tiler (placeholder - to be filled per tiler.production.yml)
# ============================================================
tiler:
  enabled: false
