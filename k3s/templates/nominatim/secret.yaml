{{- if .Values.nominatim.enabled -}}
# Pre-create or manage via sealed-secrets/external-secrets:
#   kubectl create secret generic nominatim-env --from-env-file=.env.nominatim -n <ns>
apiVersion: v1
kind: Secret
metadata:
  name: nominatim-env
  labels:
    {{- include "ohm.serviceLabels" (dict "ctx" . "name" "nominatim") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData: {}
{{- end }}
