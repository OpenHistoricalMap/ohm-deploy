{{- if and .Values.taginfo.enabled .Values.taginfo.web.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: taginfo-web
  labels:
    {{- include "ohm.serviceLabels" (dict "ctx" . "name" "taginfo-web") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taginfo-web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
