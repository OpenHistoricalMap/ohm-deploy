{{- if .Values.overpass.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: overpass
  labels:
    {{- include "ohm.serviceLabels" (dict "ctx" . "name" "overpass") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: overpass
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
