{{- if .Values.osmcha.enabled -}}
# Pre-create or manage via sealed-secrets/external-secrets:
#   kubectl create secret generic osmcha-env --from-env-file=.env.osmcha -n <ns>
apiVersion: v1
kind: Secret
metadata:
  name: osmcha-env
  labels:
    {{- include "ohm.serviceLabels" (dict "ctx" . "name" "osmcha") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData: {}
---
# Scripts mounted into osmcha-cron. Populate with files from hetzner/osmcha/script
# by running:
#   kubectl create configmap osmcha-scripts \
#     --from-file=update.sh=hetzner/osmcha/script/update.sh \
#     --from-file=backfill_changesets.py=hetzner/osmcha/script/backfill_changesets.py \
#     -n <ns>
apiVersion: v1
kind: ConfigMap
metadata:
  name: osmcha-scripts
  labels:
    {{- include "ohm.serviceLabels" (dict "ctx" . "name" "osmcha") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
data: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: osmcha-nginx
  labels:
    {{- include "ohm.serviceLabels" (dict "ctx" . "name" "osmcha") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
data:
  nginx.conf: |
    # Replace at deploy time. Source: hetzner/osmcha/config/nginx.conf
    # kubectl create configmap osmcha-nginx \
    #   --from-file=nginx.conf=hetzner/osmcha/config/nginx.conf -n <ns>
{{- end }}
