name: Preview tiler (k3s)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: vtiles-* branch to preview
        required: true
  push:
    branches:
      - 'vtiles-*'

concurrency:
  # one run per branch; a new push cancels the in-flight preview build
  group: preview-tiler-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Resolve names
        id: n
        run: |
          BRANCH="${{ github.event.inputs.ref || github.ref_name }}"
          case "$BRANCH" in
            vtiles-*) ;;
            *) echo "::error::branch '$BRANCH' must start with vtiles-"; exit 1 ;;
          esac
          # DNS-safe slug: lowercase, non-alnum -> '-', trim, max 40 chars.
          SLUG="$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g; s/-\+/-/g; s/^-//; s/-$//' | cut -c1-40 | sed 's/-$//')"
          echo "branch=$BRANCH"                  >> $GITHUB_OUTPUT
          echo "slug=$SLUG"                       >> $GITHUB_OUTPUT
          echo "release=tiler-$SLUG"              >> $GITHUB_OUTPUT
          echo "namespace=preview"               >> $GITHUB_OUTPUT
          echo "host=tiler-$SLUG.ohmstaging.org"  >> $GITHUB_OUTPUT
          echo "martin_svc=tiler-$SLUG-tiler-server-martin" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.n.outputs.branch }}
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup git
        run: |
          git config --global user.email "noreply@developmentseed.org"
          git config --global user.name "Github Action"

      - name: Install chartpress
        run: pip install chartpress==2.3.0 ruamel.yaml

      - name: Run chartpress (build + push)
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_GITHUB_TOKEN }}
        run: chartpress --push

      - name: Install cloudflared
        run: |
          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.1

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          KCFG="${{ secrets.STAGING_K3S_KUBECONFIG }}"
          if [ -z "$KCFG" ]; then
            echo "ERROR: STAGING_K3S_KUBECONFIG is empty" >&2; exit 1
          fi
          echo "$KCFG" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Open Cloudflare Access tunnel to k3s API
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.STAGING_CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.STAGING_CF_ACCESS_CLIENT_SECRET }}
        run: |
          cloudflared access tcp --hostname k3s.ohmstaging.org --url 127.0.0.1:16443 &
          for i in {1..30}; do
            if curl -sk -o /dev/null --max-time 5 https://127.0.0.1:16443/livez; then
              echo "tunnel up (k3s reachable)"; exit 0
            fi
            sleep 2
          done
          echo "Tunnel failed to reach k3s" >&2; exit 1

      - name: Verify access
        run: kubectl get nodes

      - name: Substitute secrets into preview-tiler values
        uses: bluwy/substitute-string-action@v3
        with:
          _input-file: 'values.k3s.preview-tiler.template.yaml'
          _format-key: '{{key}}'
          _output-file: 'values.k3s.preview-tiler.yaml'
          SLUG: ${{ steps.n.outputs.slug }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Helm dep up
        run: cd ohm && helm dep up

      - name: Deploy tiler preview
        run: |
          helm upgrade --install ${{ steps.n.outputs.release }} ./ohm \
            -n ${{ steps.n.outputs.namespace }} --create-namespace \
            -f ./ohm/values.yaml \
            -f ./values.k3s.preview-tiler.yaml
          # no --wait: the imposm full import runs in the background

      - name: Expose martin via Ingress
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ${{ steps.n.outputs.release }}-ingress
            namespace: ${{ steps.n.outputs.namespace }}
            annotations:
              traefik.ingress.kubernetes.io/router.middlewares: preview-https-proto@kubernetescrd
          spec:
            ingressClassName: traefik
            rules:
              - host: ${{ steps.n.outputs.host }}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: ${{ steps.n.outputs.martin_svc }}
                          port:
                            number: 80
          EOF

      - name: Summary
        run: |
          echo "Tiler preview deploying for branch ${{ steps.n.outputs.branch }}"
          echo "URL (after import finishes): https://${{ steps.n.outputs.host }}"
          echo "Watch import: kubectl -n preview logs ${{ steps.n.outputs.release }}-tiler-imposm-sts-0 -f"
