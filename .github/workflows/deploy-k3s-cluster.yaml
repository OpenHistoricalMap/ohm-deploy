name: Deploy k3s cluster
run-name: >-
  ${{ github.event_name == 'workflow_run'
      && format('Deploy k3s cluster — {0}: {1}', github.event.workflow_run.head_branch, github.event.workflow_run.head_commit.message)
      || format('Deploy k3s cluster — manual: {0}', inputs.ref) }}

# Deploys the ohm/ chart to the Hetzner k3s cluster (ohm-k3s-cluster repo).
#
# A push to staging deploys staging, a push to main deploys production.
#
# Triggers:
#   - workflow_run: the only automatic trigger. A push runs build-images
#     first, which triggers this on success, so the images are always in
#     ghcr.io before we use them — even when a commit changes both config
#     and images.
#   - workflow_dispatch: manual deploy of a branch. For a commit that changed
#     images/**, build-images must have run first so the image exists.
#
# The deploy runs `chartpress --skip-build` itself to rewrite the
# image tags in ohm/values.yaml. The tags are derived from git history,
# so on the same commit they match exactly what build-images pushed.
# No artifact is passed between workflows.

on:
  workflow_run:
    workflows: ['Build images (chartpress)']
    types: [completed]
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        required: true
        default: staging

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # staging / production secrets + vars live in GitHub environments
    environment: ${{ ((github.event_name == 'workflow_dispatch' && inputs.ref) || github.event.workflow_run.head_branch) == 'main' && 'production' || 'staging' }}
    env:
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
    steps:
      - name: Resolve ref + env
        id: src
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              BRANCH="${{ github.event.inputs.ref }}"
              SHA="${{ github.event.inputs.ref }}" ;;
            workflow_run)
              BRANCH="${{ github.event.workflow_run.head_branch }}"
              SHA="${{ github.event.workflow_run.head_sha }}" ;;
            *)
              BRANCH="${{ github.ref_name }}"
              SHA="${{ github.sha }}" ;;
          esac
          case "$BRANCH" in
            main)          ENV="production" ;;
            staging)       ENV="staging" ;;
            k3s-staging)   ENV="staging" ;;
            *)             ENV="staging" ;;
          esac
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "Deploying ref=$BRANCH ($SHA) to $ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.src.outputs.sha }}
          fetch-depth: 0

      # ============================================================
      # Recompute image tags (no build/push). Same commit + full git
      # history => same tags build-images pushed.
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install chartpress
        run: pip install chartpress==2.3.0 ruamel.yaml

      - name: Run chartpress (rewrite image tags, no build)
        run: chartpress --skip-build

      # ============================================================
      # Substitute secrets. Values come from the GitHub environment
      # (staging / production) set on this job: secrets.* for secrets,
      # vars.* for public values. Same names in both environments.
      # ============================================================
      - name: Substitute secrets
        uses: bluwy/substitute-string-action@v1
        with:
          _input-file: values.${{ steps.src.outputs.env }}.template.yaml
          _format-key: '{{key}}'
          _output-file: values.${{ steps.src.outputs.env }}.yaml
          # ======================== AWS keys ========================
          AWS_KEY: ${{ secrets.AWS_KEY }}
          AWS_KEY_SECRET: ${{ secrets.AWS_KEY_SECRET }}
          # ======================== Web database (web-db) ========================
          DB: ${{ vars.DB }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_BACKUP_S3_BUCKET: ${{ vars.DB_BACKUP_S3_BUCKET }}
          # ======================== Web database backups (pgBackRest) ========================
          PGBACKREST_CIPHER_PASS: ${{ secrets.PGBACKREST_CIPHER_PASS }}
          # ======================== Website (web-api) ========================
          ID_APPLICATION: ${{ vars.ID_APPLICATION }}
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          OAUTH_KEY: ${{ secrets.OAUTH_KEY }}
          ID_OAUTH_CLIENT_ID: ${{ vars.ID_OAUTH_CLIENT_ID }}
          ID_OAUTH_KEY: ${{ vars.ID_OAUTH_KEY }}
          RAILS_CREDENTIALS_YML_ENC: ${{ secrets.RAILS_CREDENTIALS_YML_ENC }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          OPENSTREETMAP_AUTH_ID: ${{ vars.OPENSTREETMAP_AUTH_ID }}
          OPENSTREETMAP_AUTH_SECRET: ${{ secrets.OPENSTREETMAP_AUTH_SECRET }}
          WIKIPEDIA_AUTH_ID: ${{ vars.WIKIPEDIA_AUTH_ID }}
          WIKIPEDIA_AUTH_SECRET: ${{ secrets.WIKIPEDIA_AUTH_SECRET }}
          # ======================== Mail (web-api, tasking manager) ========================
          # staging overrides MAILER_USERNAME / MAILER_PASSWORD in its environment
          MAILER_ADDRESS: ${{ secrets.MAILER_ADDRESS }}
          MAILER_USERNAME: ${{ secrets.MAILER_USERNAME }}
          MAILER_PASSWORD: ${{ secrets.MAILER_PASSWORD }}
          # ======================== Tiler (tiler-db, imposm, martin, cache) ========================
          TILER_DB_PASSWORD: ${{ secrets.TILER_DB_PASSWORD }}
          SQS_QUEUE_URL: ${{ vars.SQS_QUEUE_URL }}
          # ======================== Tasking manager ========================
          TM_DB_PASSWORD: ${{ secrets.TM_DB_PASSWORD }}
          TM_API_SECRET: ${{ secrets.TM_API_SECRET }}
          TM_CLIENT_ID: ${{ vars.TM_CLIENT_ID }}
          TM_CLIENT_SECRET: ${{ secrets.TM_CLIENT_SECRET }}
          # ======================== Nominatim ========================
          NOMINATIM_PG_PASSWORD: ${{ secrets.NOMINATIM_PG_PASSWORD }}
          # ======================== OSMCha ========================
          OSMCHA_PG_PASSWORD: ${{ secrets.OSMCHA_PG_PASSWORD }}
          OSMCHA_DJANGO_SECRET_KEY: ${{ secrets.OSMCHA_DJANGO_SECRET_KEY }}
          OSMCHA_OAUTH2_OSM_KEY: ${{ vars.OSMCHA_OAUTH2_OSM_KEY }}
          OSMCHA_OAUTH2_OSM_SECRET: ${{ secrets.OSMCHA_OAUTH2_OSM_SECRET }}
          # ======================== MapRoulette ========================
          MAPROULETTE_PG_PASSWORD: ${{ secrets.MAPROULETTE_PG_PASSWORD }}
          MAPROULETTE_APPLICATION_SECRET: ${{ secrets.MAPROULETTE_APPLICATION_SECRET }}
          MAPROULETTE_SECRET_KEY: ${{ secrets.MAPROULETTE_SECRET_KEY }}
          MR_OAUTH_CONSUMER_KEY: ${{ vars.MR_OAUTH_CONSUMER_KEY }}
          MR_OAUTH_CONSUMER_SECRET: ${{ secrets.MR_OAUTH_CONSUMER_SECRET }}
          # ======================== Level0 ========================
          LEVEL0_OAUTH2_CLIENT_ID: ${{ vars.LEVEL0_OAUTH2_CLIENT_ID }}
          LEVEL0_OAUTH2_CLIENT_SECRET: ${{ secrets.LEVEL0_OAUTH2_CLIENT_SECRET }}
          # ======================== Shared (S3 bucket) ========================
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          # ======================== Monitoring ========================
          OHM_SLACK_WEBHOOK_URL: ${{ secrets.OHM_SLACK_WEBHOOK_URL }}

      # ============================================================
      # helm + k3s cluster deploy
      # ============================================================
      - name: Install helm
        run: |
          curl -L https://get.helm.sh/helm-v3.14.4-linux-amd64.tar.gz -o helm.tar.gz
          tar -xvzf helm.tar.gz
          sudo mv linux-amd64/helm /usr/local/bin/
          sudo chmod +x /usr/local/bin/helm
          helm version

      # The k3s API is not public: open an ssh forward as the `deploy` user.
      # Secrets <ENV>_K3S_CLUSTER_* come from ci-secrets.sh in ohm-deployment.
      - name: Open the k3s API
        env:
          PREFIX: ${{ steps.src.outputs.env == 'production' && 'PRODUCTION' || 'STAGING' }}
          SSH_KEY: ${{ secrets[format('{0}_K3S_CLUSTER_SSH_KEY', steps.src.outputs.env == 'production' && 'PRODUCTION' || 'STAGING')] }}
          KNOWN_HOSTS: ${{ secrets[format('{0}_K3S_CLUSTER_KNOWN_HOSTS', steps.src.outputs.env == 'production' && 'PRODUCTION' || 'STAGING')] }}
          TARGET: ${{ secrets[format('{0}_K3S_CLUSTER_SSH_TARGET', steps.src.outputs.env == 'production' && 'PRODUCTION' || 'STAGING')] }}
          KUBECONFIG_DATA: ${{ secrets[format('{0}_K3S_CLUSTER_KUBECONFIG', steps.src.outputs.env == 'production' && 'PRODUCTION' || 'STAGING')] }}
        run: |
          [ -n "$SSH_KEY" ] && [ -n "$TARGET" ] && [ -n "$KUBECONFIG_DATA" ] || { echo "ERROR: ${PREFIX}_K3S_CLUSTER_* secrets are empty" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -fN -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -L 6443:127.0.0.1:6443 "$TARGET"
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Helm repo + deps
        run: |
          helm repo add osm-seed https://osm-seed.github.io/osm-seed-chart/
          helm repo update
          cd ohm && helm dep up

      - name: Staging - helm deploy
        if: steps.src.outputs.env == 'staging'
        run: helm upgrade --install staging --wait --timeout 30m ohm/ -f values.staging.yaml -f ohm/values.yaml

      - name: Production - helm deploy
        if: steps.src.outputs.env == 'production'
        run: helm upgrade --install production --wait --timeout 30m ohm/ -f values.production.yaml -f ohm/values.yaml
