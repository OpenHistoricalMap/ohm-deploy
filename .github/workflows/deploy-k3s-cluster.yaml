name: Deploy k3s cluster
on:
  workflow_run:
    workflows: ['Build images (chartpress)']
    types: [completed]
    branches:
      - staging-new
      - deploy-*
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        required: true
        default: staging-new

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Resolve env
        id: src
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              BRANCH="${{ github.event.inputs.ref }}"
              SHA="${{ github.event.inputs.ref }}" ;;
            workflow_run)
              BRANCH="${{ github.event.workflow_run.head_branch }}"
              SHA="${{ github.event.workflow_run.head_sha }}" ;;
          esac
          # Only staging lives on this cluster for now.
          case "$BRANCH" in
            staging-new) ENV="staging" ;;
            deploy-*)    ENV="staging" ;;
            *)         echo "::error::$BRANCH does not deploy to the k3s cluster"; exit 1 ;;
          esac
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "release=$ENV-new" >> $GITHUB_OUTPUT
          echo "namespace=$ENV-new" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.src.outputs.sha }}
          fetch-depth: 0

      # Recompute image tags (no build/push). Same commit + full git
      # history => same tags build-images pushed.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install chartpress
        run: pip install chartpress==2.3.0 ruamel.yaml

      - name: Run chartpress (rewrite image tags, no build)
        run: chartpress --skip-build

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.1

      - name: Open the k3s API
        env:
          SSH_KEY: ${{ secrets.STAGING_K3S_CLUSTER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_K3S_CLUSTER_KNOWN_HOSTS }}
          TARGET: ${{ secrets.STAGING_K3S_CLUSTER_SSH_TARGET }}
          KUBECONFIG_DATA: ${{ secrets.STAGING_K3S_CLUSTER_KUBECONFIG }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -fN -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 \
            -L 6443:127.0.0.1:6443 "$TARGET"
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # The CI token cannot list nodes: check the namespace it deploys to.
      - name: Verify access
        run: |
          kubectl get namespace ${{ steps.src.outputs.namespace }}
          helm version --short

      - name: Staging - substitute secrets
        if: steps.src.outputs.env == 'staging'
        uses: bluwy/substitute-string-action@v3
        with:
          _input-file: 'values.staging.template.yaml'
          _format-key: '{{key}}'
          _output-file: 'values.staging.yaml'
          # The restored copy of production, with the password set on promote.
          STAGING_DB: openstreetmap
          STAGING_DB_USER: postgres
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          # Mail off: the database has real users. This host does not resolve.
          MAILER_ADDRESS: mail.disabled.invalid
          MAILER_USERNAME: none
          MAILER_PASSWORD: none
          # The rest as in deploy-eks.yaml.
          STAGING_S3_BUCKET: ${{ secrets.STAGING_S3_BUCKET }}
          STAGING_PGBACKREST_CIPHER_PASS: ${{ secrets.STAGING_PGBACKREST_CIPHER_PASS }}
          STAGING_RAILS_CREDENTIALS_YML_ENC: ${{ secrets.STAGING_RAILS_CREDENTIALS_YML_ENC }}
          STAGING_RAILS_MASTER_KEY: ${{ secrets.STAGING_RAILS_MASTER_KEY }}
          STAGING_OPENSTREETMAP_AUTH_ID: ${{ secrets.STAGING_OPENSTREETMAP_AUTH_ID }}
          STAGING_OPENSTREETMAP_AUTH_SECRET: ${{ secrets.STAGING_OPENSTREETMAP_AUTH_SECRET }}
          STAGING_WIKIPEDIA_AUTH_ID: ${{ secrets.STAGING_WIKIPEDIA_AUTH_ID }}
          STAGING_WIKIPEDIA_AUTH_SECRET: ${{ secrets.STAGING_WIKIPEDIA_AUTH_SECRET }}
          STAGING_TM_DB_PASSWORD: ${{ secrets.STAGING_TM_DB_PASSWORD }}
          STAGING_TM_API_SECRET: ${{ secrets.STAGING_TM_API_SECRET }}
          OHM_SLACK_WEBHOOK_URL: ${{ secrets.OHM_SLACK_WEBHOOK_URL }}

      - name: Helm dep up (pull osm-seed subchart)
        run: cd ohm && helm dep up

      - name: Helm lint
        run: |
          helm lint ./ohm \
            -f ./ohm/values.yaml \
            -f ./values.${{ steps.src.outputs.env }}.yaml

      - name: Helm deploy
        run: |
          helm upgrade --install ${{ steps.src.outputs.release }} ./ohm \
            -n ${{ steps.src.outputs.namespace }} \
            -f ./ohm/values.yaml \
            -f ./values.${{ steps.src.outputs.env }}.yaml \
            --wait --timeout=15m

      - name: Show release status
        if: always()
        run: |
          helm -n ${{ steps.src.outputs.namespace }} list
          kubectl -n ${{ steps.src.outputs.namespace }} get all
