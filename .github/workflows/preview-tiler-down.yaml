name: Preview tiler down (k3s)

# Remove a tiler preview: helm uninstall + delete its ingress and released PVs.
# The host disks (/mnt/tiler-db-data-<slug>, /mnt/tiler-imposm-data-<slug>) use
# Retain PVs, so the data stays on the node after this runs. To reclaim disk or
# rebuild from scratch, delete those dirs on the node manually.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: vtiles-* branch whose preview to remove
        required: true
  delete:
  pull_request:
    types: [closed]

jobs:
  teardown:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Resolve branch
        id: r
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) BRANCH="${{ github.event.inputs.ref }}" ;;
            delete)            BRANCH="${{ github.event.ref }}" ;;
            pull_request)      BRANCH="${{ github.event.pull_request.head.ref }}" ;;
          esac
          case "$BRANCH" in
            vtiles-*) ;;
            *) echo "branch '$BRANCH' is not a vtiles-* preview; nothing to do"; echo "skip=true" >> $GITHUB_OUTPUT; exit 0 ;;
          esac
          SLUG="$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g; s/-\+/-/g; s/^-//; s/-$//' | cut -c1-40 | sed 's/-$//')"
          echo "slug=$SLUG"           >> $GITHUB_OUTPUT
          echo "release=tiler-$SLUG"  >> $GITHUB_OUTPUT
          echo "namespace=preview"    >> $GITHUB_OUTPUT

      - name: Install cloudflared
        if: steps.r.outputs.skip != 'true'
        run: |
          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Install helm
        if: steps.r.outputs.skip != 'true'
        uses: azure/setup-helm@v4
        with:
          version: v3.15.1

      - name: Setup kubeconfig
        if: steps.r.outputs.skip != 'true'
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.STAGING_K3S_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Open Cloudflare Access tunnel to k3s API
        if: steps.r.outputs.skip != 'true'
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.STAGING_CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.STAGING_CF_ACCESS_CLIENT_SECRET }}
        run: |
          cloudflared access tcp --hostname k3s.ohmstaging.org --url 127.0.0.1:16443 &
          for i in {1..30}; do
            if curl -sk -o /dev/null --max-time 5 https://127.0.0.1:16443/livez; then
              echo "tunnel up"; exit 0
            fi
            sleep 2
          done
          echo "Tunnel failed to reach k3s" >&2; exit 1

      - name: Teardown
        if: steps.r.outputs.skip != 'true'
        run: |
          NS=${{ steps.r.outputs.namespace }}
          REL=${{ steps.r.outputs.release }}
          kubectl -n "$NS" delete ingress "$REL-ingress" --ignore-not-found
          helm -n "$NS" uninstall "$REL" || echo "release $REL not found"
          # delete the Retain PVs left behind (data on disk is NOT removed)
          kubectl delete pv -l "app.kubernetes.io/instance=$REL" --ignore-not-found
          echo "Done. Host disks /mnt/tiler-db-data-${{ steps.r.outputs.slug }} and"
          echo "/mnt/tiler-imposm-data-${{ steps.r.outputs.slug }} remain on the node."
          echo "rm them manually to reclaim space or rebuild from scratch."
