  # ====================================================================================================
  # Variables for nominatim ui
  # ====================================================================================================
  nominatimUI:
    enabled: true
    image:
      name: ghcr.io/openhistoricalmap/nominatim-ui
      tag: a469b5e
  # ====================================================================================================
