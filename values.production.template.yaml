      PLANET_STATS_STATE_S3_URI: "s3://planet.openhistoricalmap.org"
      # --- Upload to S3
      AWS_S3_BUCKET: {{PRODUCTION_S3_BUCKET}}
      AWS_S3_ENDPOINT: ""
      AWS_ACCESS_KEY_ID: {{PRODUCTION_AWS_KEY}}
      AWS_SECRET_ACCESS_KEY: {{PRODUCTION_AWS_KEY_SECRET}}
    # resources enabled with high memory/cpu for the processing job;
    resources: {}
    nodeSelector: {}
    nodeAffinity:
      enabled: true
      key: "nodegroup_type"
      values: ["downstream"]
  # ====================================================================================================
