      staticHostPath: true
      localVolumeHostPath: /mnt/osmcha-data
      localVolumeSize: 10Gi
    nodeSelector: {}
    nodeAffinity:
      enabled: true
      key: "nodegroup_type"
      values: ["downstream"]

  # ====================================================================================================
  # Variables for osmcha osm-adiff-service
  # ====================================================================================================
  adiffService:
    enabled: false

  # ====================================================================================================
  # Planet files server
  # ====================================================================================================
  planetFiles:
    enabled: false

  # ====================================================================================================
  # Variables for ohmx-adiff-builder (osmcha augmented diff source)
  # ====================================================================================================
  osmxAdiffBuilder:
    enabled: true
    # Give the initial osmx build (download planet + build db) time before the
    # liveness probe starts checking for the create_diff_files heartbeat.
    livenessProbe:
      initialDelaySeconds: 18000
    env:
      # --- Settings
      PLANET_PBF_URL: https://planet.openhistoricalmap.org/planet/planet-260601_0301.osm.pbf
      MINUTE_REPLICATION_URL: https://planet.openhistoricalmap.org/replication/minute
      API_URL: https://api.openhistoricalmap.org
      HEARTBEAT_DIR: /tmp/heartbeat
      HEARTBEAT_STALE_SECONDS: "18000"
      # --- Upload to S3
      AWS_S3_BUCKET: planet.openhistoricalmap.org
      AWS_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: {{PRODUCTION_AWS_KEY}}
      AWS_SECRET_ACCESS_KEY: {{PRODUCTION_AWS_KEY_SECRET}}
    persistenceDisk:
      enabled: true
      mountPath: /data
      size: 50Gi
      storageClassName: ""
      # k3s: staticHostPath=true uses a fixed hostPath dir (reusable across releases); false = dynamic local-path
      staticHostPath: true
      localVolumeHostPath: /mnt/osmx-adiff-data
      localVolumeSize: 50Gi
    resources:
      requests:
        memory: "20Gi"
        cpu: "4"
      limits:
        memory: "25Gi"
        cpu: "8"
    nodeSelector: {}
    nodeAffinity:
      enabled: true
      key: "nodegroup_type"
      values: ["downstream"]

  # ====================================================================================================
