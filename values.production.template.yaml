      OSM_API_URL: https://www.openhistoricalmap.org/api/0.6/
      OAUTH2_CLIENT_ID: "rs99ze6oTxDbwRW-05qIspMV1Lnl9jt3VyfnAp3oLUA"
      OAUTH2_CLIENT_SECRET: "arHSio3aAlxy6FXTf40Jq23PM_byt-Q2pHsbpvBt6BI"
      OVERPASS_API: "overpass-api.openhistoricalmap.org"
      MAX_REQUEST_OBJECTS: "500"
    resources: {}
    nodeSelector: {}
    nodeAffinity:
      enabled: true
      key: "nodegroup_type"
      values: ["downstream"]
